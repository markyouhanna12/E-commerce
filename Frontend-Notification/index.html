<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FCM Notification Test</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 50px auto;
        padding: 20px;
      }

      button {
        padding: 12px 20px;
        margin: 10px 0;
        cursor: pointer;
      }

      textarea {
        width: 100%;
        height: 150px;
        margin-top: 10px;
      }

      #status {
        margin-top: 20px;
        padding: 10px;
        background: #f1f1f1;
      }
    </style>
  </head>

  <body>
    <h1>FCM Notification Test</h1>

    <button id="enableNotifications">Enable Notifications</button>

    <h3>FCM Token</h3>

    <textarea
      id="token"
      readonly
      placeholder="FCM token will appear here..."
    ></textarea>

    <div id="status">Status: Waiting...</div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
